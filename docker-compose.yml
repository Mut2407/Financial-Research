name: financial-data-poc

x-app: &app
  image: financial-data-poc:local
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data

services:
  pipeline:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "src.pipeline.cli", "bootstrap"]
    environment:
      ENVIRONMENT: docker
      DATA_PROVIDER: VNSTOCK_FREE
      VNSTOCK_REQUESTS_PER_MINUTE: 60
      RAW_DATA_DIR: data/raw/ohlcv
      CURATED_DATA_DIR: data/curated/ohlcv
      SEED_RAW_DATA_DIR: reports/raw/ohlcv
    restart: "no"

  backend:
    <<: *app
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: docker
      DATA_PROVIDER: VNSTOCK_FREE
      VNSTOCK_REQUESTS_PER_MINUTE: 60
      RAW_DATA_DIR: data/raw/ohlcv
      CURATED_DATA_DIR: data/curated/ohlcv
      SEED_RAW_DATA_DIR: reports/raw/ohlcv
      CORS_ORIGINS: "http://localhost:8501,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      pipeline:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped

