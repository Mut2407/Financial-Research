[project]
name = "financial-data-poc"
version = "0.1.0"
description = "Local-first financial data pipeline PoC"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb>=1.3,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "pyarrow>=19,<26",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "requests>=2.32,<3",
    "streamlit>=1.45,<2",
    "streamlit-option-menu>=0.4,<1",
    "uvicorn[standard]>=0.34,<1",
    "vnstock>=4.0.3,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.3,<3",
    "pyyaml>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
junit_family = "legacy"
markers = [
    "unit: isolated tests for one module or class",
    "integration: tests across repository components without external network access",
    "frontend: Streamlit user-flow and frontend HTTP-client tests",
    "performance: deterministic local latency quality gates",
    "container: static and executable container composition contract tests",
    "live: opt-in tests that call an external market-data provider",
]

[tool.coverage.run]
branch = true
source = ["src", "frontend"]
omit = ["src/legacy/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    'if TYPE_CHECKING:',
    '\.\.\.',
]
